<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_justatee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <radialGradient id="glow_justatee" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="12" fill="url(#bg_justatee)" />
  <circle cx="120" cy="95" r="75" fill="url(#glow_justatee)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="236" height="236" rx="10" fill="none" stroke="#fcd34d" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stylized Avatar Emblem -->
  <circle cx="120" cy="85" r="44" fill="#0f131a" stroke="#fcd34d" stroke-width="2.5" />
  <circle cx="120" cy="85" r="38" fill="#78350f" fill-opacity="0.6" />
  
  <g transform="translate(108, 73)">
    <svg viewBox="0 0 24 24" width="24" height="24">
      <path d="M9 18V5l12-2v13M9 9l12-2" stroke="#fcd34d" stroke-width="2" fill="none"/><circle cx="6" cy="18" r="3" fill="#fcd34d"/><circle cx="18" cy="16" r="3" fill="#fcd34d"/>
    </svg>
  </g>

  <!-- Sub-badge -->
  <g transform="translate(120, 142)">
    <rect x="-55" y="-10" width="110" height="20" rx="10" fill="#fcd34d" fill-opacity="0.2" stroke="#fcd34d" stroke-width="1"/>
    <text x="0" y="4" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">VIET RAP</text>
  </g>

  <!-- Artist Name Box -->
